<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home Page</title>
</head>
<body>
    <div class="content" id="home">
      <h1 class="home-page">Home Page</h1>
      <div class="main-section">
        <div class="left">
          <h1 class="heading1">Revitalize Your</h1>
          <h1 class="heading2">Clothes With Expert</h1>
          <h1 class="heading3">Laundry Services!</h1>
          <p class="description">
            From premium dry cleaning to swift and fold,we deliver care and
            convenience. Schedule a pickup and rediscover the freshness of your
            clothes today!
          </p>
          <div class="book-button">
            <button class="book-service">Book a service today!</button>
          </div>
        </div>
        <div class="right">
          <div class="image-container">
            <img
              class="image"
              src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRh3oXm_dZgZQFyfrmH7TPlkFisugd7B-5ULQ&s"
              alt="washing machine image"
            />
          </div>
        </div>
      </div>

      <div class="main-footer">
        <div class="reviews">
          <div class="achivements">
            <h2>Our Achivements</h2>
          </div>
          <div class="services">
            <div class="numbers">15+</div>
            <div class="achivements-content">Laundry Services</div>
          </div>
          <div class="customers">
            <div class="numbers">240+</div>
            <div class="achivements-content">Happy Customers</div>
          </div>
          <div class="experience">
            <div class="numbers">2+ Years</div>
            <div class="achivements-content">Experience</div>
          </div>
        </div>
      </div>
    </div>
    <link rel="stylesheet" href="/style.css">
</body>
</html>
